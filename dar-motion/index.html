<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Dar Motion</title>
<style>
@font-face{font-family:Naskh;font-weight:700;src:url(node_modules/@fontsource/noto-naskh-arabic/files/noto-naskh-arabic-arabic-700-normal.woff2)}
@font-face{font-family:Naskh;font-weight:400;src:url(node_modules/@fontsource/noto-naskh-arabic/files/noto-naskh-arabic-arabic-400-normal.woff2)}
@font-face{font-family:Ruqaa;font-weight:400;src:url(node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-400-normal.woff2)}
@font-face{font-family:Ruqaa;font-weight:700;src:url(node_modules/@fontsource/aref-ruqaa/files/aref-ruqaa-arabic-700-normal.woff2)}
@font-face{font-family:Amiri;font-weight:700;src:url(node_modules/@fontsource/amiri/files/amiri-arabic-700-normal.woff2)}
@font-face{font-family:Tajawal;font-weight:400;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-400-normal.woff2)}
@font-face{font-family:Tajawal;font-weight:700;src:url(node_modules/@fontsource/tajawal/files/tajawal-arabic-700-normal.woff2)}

:root{
  --cream:#E6DDC8; --burgundy:#5B1914; --navy:#1C2440; --brown:#6B3A22; --paper:#F4F0E6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--cream)}
#stage{position:absolute;inset:0;background:var(--cream);overflow:hidden}

/* ticket frame: inset window with concave (scalloped) corners */
#win{position:absolute;left:34px;right:34px;top:34px;bottom:34px;overflow:hidden;background:var(--burgundy);
  --r:58px;
  -webkit-mask:
    radial-gradient(circle at 0 0,#0000 var(--r),#000 calc(var(--r) + 1px)) top left,
    radial-gradient(circle at 100% 0,#0000 var(--r),#000 calc(var(--r) + 1px)) top right,
    radial-gradient(circle at 0 100%,#0000 var(--r),#000 calc(var(--r) + 1px)) bottom left,
    radial-gradient(circle at 100% 100%,#0000 var(--r),#000 calc(var(--r) + 1px)) bottom right;
  -webkit-mask-size:51% 51%;-webkit-mask-repeat:no-repeat;}
.layer{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute;will-change:transform,opacity}

/* photo slot (real image or placeholder) */
.slot{position:absolute;overflow:hidden;background:#3a2a22}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.ph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:360px !important;gap:18px;
  font-family:Tajawal;color:#f3ead8;text-align:center;padding:40px;position:relative}
.ph::after{content:"";position:absolute;inset:22px;border:3px dashed rgba(243,234,216,.45);border-radius:18px}
.ph .k{font-size:30px;letter-spacing:2px;opacity:.75;font-weight:700}
.ph .d{font-size:46px;font-weight:700;line-height:1.35}
.ph.small{justify-content:center;padding-bottom:40px !important}.ph.small .k{font-size:20px}.ph.small .d{font-size:28px}.ph.small::after{inset:10px;border-width:2px}

/* white caption */
#cap{position:absolute;right:96px;top:0;width:820px;text-align:right;font-family:Naskh;font-weight:700;
  color:#fff;font-size:102px;line-height:1.22;text-shadow:0 4px 20px rgba(0,0,0,.5)}
#cap .ln{display:block;white-space:nowrap}
#cap .w{display:inline-block;margin-left:.22em}
#cap.boxed{display:flex;flex-direction:column;align-items:flex-start;gap:14px;font-size:84px;line-height:1.15}
#cap.boxed .ln{display:block}
#cap.boxed .w{background:var(--burgundy);padding:2px 22px 14px;margin:0;border-radius:4px;text-shadow:none}

/* paper note */
.note{position:absolute;width:540px;height:350px;background:var(--paper);
  background-image:repeating-linear-gradient(#0000 0 58px,#d9d2c3 58px 60px);background-position:0 70px;
  box-shadow:0 18px 30px rgba(0,0,0,.35);font-family:Ruqaa;color:#2a2622;padding:38px 46px;
  clip-path:polygon(0 0,100% 0,100% 82%,88% 100%,0 100%)}
.note .t{font-size:52px;line-height:66px}
.note .sig{position:absolute;left:46px;bottom:26px;font-size:30px;opacity:.7}
.note .curl{position:absolute;right:0;bottom:0;width:12%;height:18%;
  background:linear-gradient(135deg,#d8cfbd 0 48%,#0000 52%);filter:drop-shadow(-3px -3px 4px rgba(0,0,0,.25))}

/* receipt tag */
.tag{position:absolute;width:210px;height:96px;background:#fbf8f1;box-shadow:0 10px 18px rgba(0,0,0,.35);
  font-family:Naskh;font-weight:700;color:#1d1a17;font-size:40px;display:flex;align-items:center;justify-content:center;gap:10px}
.tag small{font-size:24px;font-weight:400;opacity:.75}

/* postage stamp */
.stamp{position:absolute;padding:20px;
  background:radial-gradient(circle,#0000 8px,#f6f3ec 8.6px) -11px -11px/22px 22px;
  filter:drop-shadow(0 14px 16px rgba(0,0,0,.4))}
.stamp .slot{position:relative;border:3px solid #fff}

/* comment bubble */
.bub{position:absolute;width:580px;height:165px;background:#fff;border-radius:22px;box-shadow:0 10px 22px rgba(0,0,0,.3);
  display:flex;align-items:center;gap:26px;padding:0 34px;font-family:Tajawal;direction:rtl}
.bub .av{width:84px;height:84px;border-radius:50%;background:#d9d3c8;flex:none}
.bub .l{flex:1;display:flex;flex-direction:column;gap:14px}
.bub .l b{font-size:28px;color:#222}
.bub .l i{font-style:normal;font-size:30px;color:#555}
.bub .l u{text-decoration:none;font-size:22px;color:#999}

/* page-curl paper */
#curl{position:absolute;width:600px;height:860px;left:40px;top:470px}
#curl .pg{position:absolute;inset:0;background:var(--paper);box-shadow:0 24px 40px rgba(0,0,0,.4);padding:70px 64px;outline:6px solid var(--navy);outline-offset:-26px;border-radius:10px;font-family:Naskh;color:#2a2622}
#curl .fold{position:absolute;left:0;top:0;background:linear-gradient(135deg,#0000 50%,#efe8d8 50%,#cfc5b0 100%);
  filter:drop-shadow(6px 6px 10px rgba(0,0,0,.35))}
.logo-txt{font-family:Ruqaa;font-weight:700;color:var(--navy)}

/* checklist */
#chk{position:absolute;inset:0;background:var(--cream);font-family:Naskh;color:#2a2622}
#chk .it{position:absolute;right:80px;left:80px;height:400px;border-bottom:3px solid #cfc4ad}
#chk .it h3{position:absolute;right:190px;top:80px;font-size:96px;font-weight:700}
#chk .it p{position:absolute;right:190px;top:220px;font-size:44px;opacity:.7}
#chk .box{position:absolute;right:20px;top:100px;width:124px;height:124px;border:7px solid #2a2622;border-radius:6px}
#chk svg{position:absolute;right:-6px;top:30px;overflow:visible}

/* map */
#map{position:absolute;inset:0;background:var(--navy)}

/* outro watercolor */
#outro{position:absolute;inset:0;background:var(--cream)}
#wc{position:absolute;left:60px;right:60px;height:1420px;
  -webkit-mask:radial-gradient(120% 95% at 50% 55%,#000 62%,#0000 80%);}
#wcTitle{position:absolute;left:0;right:0;text-align:center;font-family:Amiri;font-weight:700;color:var(--brown);font-size:110px;line-height:1.3}
#endlogo{position:absolute;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>
<div id="stage">
  <div id="win"></div>
  <div id="outro"></div>
  <div id="endlogo"></div>
</div>
<script>
/* ======================== CONFIG ======================== */
const FPS = 25;
const VO_END = 44.6, DUR = 47.8;
// assets present on disk are injected by render.js as window.ASSETS = {name: "assets/file.jpg"}
const A = window.ASSETS || {};

/* ======================== HELPERS ======================== */
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const prog=(t,a,d)=>clamp((t-a)/d);
const eOutCubic=x=>1-Math.pow(1-x,3);
const eInCubic=x=>x*x*x;
const eInOut=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOutBack=(x,s=1.9)=>1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);
const lerp=(a,b,x)=>a+(b-a)*x;
// damped spring (silky-spring-motion presets), sampled analytically by fixed-step integration
const PRESET={snap:[300,22,.8],slam:[220,18,1.2],glide:[90,20,1],camera:[40,18,1.5]};
const _sc={};
function spring(dt,name='snap'){ if(dt<=0)return 0; const key=name+'|'+Math.round(dt*1000);
  if(_sc[key]!=null)return _sc[key]; const [k,c,m]=PRESET[name]; let x=0,v=0,h=1/600;
  for(let t=0;t<dt;t+=h){const a=(-k*(x-1)-c*v)/m;v+=a*h;x+=v*h;} return _sc[key]=x; }
const expoOut=x=>x>=1?1:1-Math.pow(2,-10*x);            // opacity / blur only
const blurOf=(f,t,k=60)=>Math.min(Math.abs(f(t)-f(t-1/25))*k,14); // velocity -> motion blur px
const el=(tag,cls,parent,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;(parent||document.body).appendChild(e);return e};
const set=(e,o,tr)=>{e.style.opacity=o;e.style.transform=tr;e.style.visibility=o<=0.001?'hidden':'visible'};
const vis=(e,on)=>{e.style.display=on?'':'none'};

// photo slot: real asset if provided, else labelled placeholder
const TONES={day:['#8a7a5e','#c9b48c'],night:['#0d0f17','#3a2f22'],warm:['#6d4a33','#b88c63'],sea:['#3f6475','#a9c2c4']};
function slot(parent,key,label,tone='warm',small=false){
  const s=el('div','slot',parent);
  if(A[key]){const i=el('img','',s);i.src=A[key];}
  else{const [a,b]=TONES[tone];s.style.background=`linear-gradient(160deg,${b},${a})`;
       el('div','ph'+(small?' small':''),s,`<div class="k">${key}</div><div class="d">${label}</div>`);}
  return s;
}
const full=s=>{Object.assign(s.style,{left:0,top:0,width:'100%',height:'100%'});return s};

// pop-in: scale 0.6 -> 1.06 -> 1 , quick fade (≈7 frames)
// pop-in: spring 'snap' 0->1 (overshoot ≈1.08), opacity over first 30%, velocity blur
function pop(t,t0,preset='snap'){const f=x=>spring(x-t0,preset);const s=f(t);
  return{o:expoOut(clamp((t-t0)/.09)),s:t<t0?0:Math.max(s,0),b:blurOf(f,t,40)}}
const setB=(e,o,tr,b=0)=>{set(e,o,tr);e.style.filter=b>0.3?`blur(${b.toFixed(1)}px)`:''};

/* ======================== BUILD ======================== */
const W=document.getElementById('win');           // 1012 x 1852 window
const WW=1012,WH=1852;
const scenes={};
function L(name){const l=el('div','layer',W);scenes[name]=l;return l}

// A — opening
const lA=L('A'); full(slot(lA,'01-opening','لقطة افتتاحية<br>النعيرية / الجبيل من فوق','day'));
// B — match cuts: same object, different places
const lB=L('B'); const Bs=[1,2,3,4].map(i=>full(slot(lB,`02-match-${i}`,`نفس العنصر (كوب دار)<br>في مكان ${['أول','ثاني','ثالث','رابع'][i-1]}<br>وبنفس موقعه في الكادر`,i%2?'day':'warm')));
// C — inset card on top of last match shot, then burgundy collage
const lC=L('C'); const cBg=el('div','layer',lC); cBg.style.background='var(--burgundy)';
const cCard=el('div','abs',lC); Object.assign(cCard.style,{left:'60px',top:'470px',width:'600px',height:'840px',boxShadow:'0 20px 40px rgba(0,0,0,.45)'});
const cImg1=full(slot(cCard,'03-card-front','واجهة فرع النعيرية','warm',true));
const cImg2=full(slot(cCard,'04-card-cup','يد ماسكة كوب دار','warm',true));
const tags=[[ 30,1060,-8],[110,1260,6],[ 300,1400,-4]].map(([x,y,r])=>{const g=el('div','tag abs',lC,'دار <small>النعيرية</small>');g.style.left=x+'px';g.style.top=y+'px';g.dataset.r=r;return g});
// D — notes collage
const lD=L('D'); lD.style.background='var(--burgundy)';
const NOTES=[['مرحبا…<br>والقلب أوسع من الدار',40,440,-4],['هنا تحس<br>إنك بين أهلك',0,770,3],['ضيافة وراحة<br>في كل زيارة',70,1100,-2]];
const notes=NOTES.map(([txt,x,y,r])=>{const n=el('div','note abs',lD,`<div class="t">${txt}</div><div class="sig">دار</div><div class="curl"></div>`);n.style.left=x+'px';n.style.top=y+'px';n.dataset.r=r;return n});
// E — stamps (over notes)
const lE=L('E');
const STAMPS=[['05-stamp-1','النعيرية ١',30,430,340,420,-6,'warm'],['05-stamp-2','النعيرية ٢',250,570,260,360,5,'sea'],['05-stamp-3','النعيرية ٣',120,930,320,410,-3,'day']];
const stamps=STAMPS.map(([k,lab,x,y,w,h,r,tone])=>{const s=el('div','stamp abs',lE);s.style.left=x+'px';s.style.top=y+'px';s.dataset.r=r;
  const im=slot(s,k,lab,tone,true);im.style.width=w+'px';im.style.height=h+'px';return s});
// F — comment bubbles (paste real comments)
const lF=L('F');
const bubs=[0,1,2].map(i=>{const b=el('div','bub abs',lF,`<div class="av"></div><div class="l"><b>اسم الزبون</b><i>ضع هنا لقطة تعليق حقيقي ${i+1}</i><u>رد</u></div>`);
  b.style.left='36px';b.style.top=(520+i*290)+'px';return b});
// G — night cuts
const lG=L('G'); const Gs=[['06-night-1','لوحة دار ليلاً','night'],['06-night-2','كوب دار داخل السيارة','night'],['06-night-3','جلسات الفرع ليلاً','night']].map(([k,l,t])=>full(slot(lG,k,l,t)));
// H — facade + map
const lH=L('H'); const hFac=full(slot(lH,'07-fanateer-front','واجهة فرع الفناتير','night'));
const hMap=el('div','layer',lH); hMap.id='map';
hMap.innerHTML=`<svg width="1012" height="1852" viewBox="0 0 1012 1852">
 <defs><linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a2a24"/><stop offset="1" stop-color="#5b1914"/></linearGradient>
 <pattern id="tex" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#000" opacity=".12"/></pattern></defs>
 <path d="M0 0 H520 C560 140 650 230 720 380 C790 520 740 640 800 760 C860 880 940 900 960 1000 C990 1120 1012 1150 1012 1200 V1852 H0 Z" fill="url(#land)"/>
 <path d="M0 0 H520 C560 140 650 230 720 380 C790 520 740 640 800 760 C860 880 940 900 960 1000 C990 1120 1012 1150 1012 1200 V1852 H0 Z" fill="url(#tex)"/>
 <g id="roads" fill="none" stroke="#f0c9b6" stroke-linecap="round">
  <path d="M40 1800 C180 1500 250 1250 300 1000 C340 800 320 560 380 300" stroke-width="9" opacity=".95"/><path d="M300 1000 C470 980 620 950 790 900" stroke-width="9" opacity=".95"/><path d="M90 760 C300 760 520 720 720 600" stroke-width="9" opacity=".95"/><path d="M380 300 C440 470 580 560 720 600" stroke-width="9" opacity=".95"/><path d="M520 1560 C600 1340 700 1140 820 980" stroke-width="9" opacity=".95"/><path d="M140 1300 C340 1280 520 1240 700 1150" stroke-width="9" opacity=".95"/><path d="M600 1800 C620 1560 640 1380 700 1150" stroke-width="9" opacity=".95"/><path d="M200 520 C260 640 280 800 300 1000" stroke-width="9" opacity=".95"/>
  <path d="M391 688 q110 -136 221 -46" stroke-width="4" opacity=".6"/><path d="M134 1477 q72 27 144 9" stroke-width="4" opacity=".6"/><path d="M656 498 q124 -51 249 -17" stroke-width="4" opacity=".6"/><path d="M98 556 q115 54 231 18" stroke-width="4" opacity=".6"/><path d="M131 872 q71 122 143 40" stroke-width="4" opacity=".6"/><path d="M494 501 q132 -97 264 -33" stroke-width="4" opacity=".6"/><path d="M288 1671 q140 138 280 46" stroke-width="4" opacity=".6"/><path d="M123 1561 q134 43 269 14" stroke-width="4" opacity=".6"/><path d="M110 832 q65 125 131 41" stroke-width="4" opacity=".6"/><path d="M196 973 q113 -87 227 -29" stroke-width="4" opacity=".6"/><path d="M613 621 q133 -3 266 -1" stroke-width="4" opacity=".6"/><path d="M633 750 q73 137 146 45" stroke-width="4" opacity=".6"/><path d="M644 1688 q84 30 168 10" stroke-width="4" opacity=".6"/><path d="M159 1501 q68 128 136 42" stroke-width="4" opacity=".6"/><path d="M121 1647 q86 94 172 31" stroke-width="4" opacity=".6"/><path d="M756 1468 q114 0 229 0" stroke-width="4" opacity=".6"/>
 </g>
 <g id="boxes"><rect x="556" y="1619" width="44" height="30" rx="3" fill="none" stroke="#f0c9b6" stroke-width="3" opacity=".7"/><rect x="544" y="1160" width="44" height="30" rx="3" fill="none" stroke="#f0c9b6" stroke-width="3" opacity=".7"/><rect x="386" y="928" width="44" height="30" rx="3" fill="none" stroke="#f0c9b6" stroke-width="3" opacity=".7"/><rect x="264" y="919" width="44" height="30" rx="3" fill="none" stroke="#f0c9b6" stroke-width="3" opacity=".7"/><rect x="163" y="1596" width="44" height="30" rx="3" fill="none" stroke="#f0c9b6" stroke-width="3" opacity=".7"/><rect x="387" y="1495" width="44" height="30" rx="3" fill="none" stroke="#f0c9b6" stroke-width="3" opacity=".7"/><rect x="586" y="1123" width="44" height="30" rx="3" fill="none" stroke="#f0c9b6" stroke-width="3" opacity=".7"/></g>
 <g id="pin1" transform="translate(330 640)"><path d="M0 0 C-24 -34 -38 -50 -38 -74 A38 38 0 1 1 38 -74 C38 -50 24 -34 0 0Z" fill="#fff"/><circle cy="-74" r="14" fill="#5b1914"/></g>
 <g id="pin2" transform="translate(760 960)"><path d="M0 0 C-24 -34 -38 -50 -38 -74 A38 38 0 1 1 38 -74 C38 -50 24 -34 0 0Z" fill="#fff"/><circle cy="-74" r="14" fill="#5b1914"/></g>
 <g id="lb1" font-family="Amiri" font-weight="700" fill="#fff" text-anchor="middle"><text x="330" y="500" font-size="58">Al Nairyah</text><text x="330" y="556" font-size="50" font-family="Naskh">النعيرية</text></g>
 <g id="lb2" font-family="Amiri" font-weight="700" fill="#fff" text-anchor="middle"><text x="700" y="1060" font-size="58">Al Fanateer</text><text x="700" y="1116" font-size="50" font-family="Naskh">الفناتير · الجبيل</text></g>
 <text x="900" y="420" text-anchor="middle" font-family="Amiri" font-size="40" fill="#8d97b8" opacity=".85">Arabian Gulf</text>
</svg>`;
['#pin1','#pin2'].forEach(id=>{const g=hMap.querySelector(id);const [tx,ty]=g.getAttribute('transform').match(/[\d.]+/g);g.dataset.tx=tx;g.dataset.ty=ty});
// I — interior with boxed text, hand cut, page-curl
const lI=L('I'); const iInt=full(slot(lI,'08-interior','داخل الفرع الجديد','warm')); const iHand=full(slot(lI,'09-hand','يد تفتح باب الفرع<br>أو تقلب صفحة','warm'));
const iBg=el('div','layer',lI); iBg.style.background='var(--burgundy)';
const curl=el('div','',lI); curl.id='curl';
curl.innerHTML=`<div class="pg"><div class="logo-txt" style="font-size:96px;text-align:center;line-height:1">دار</div>
 <div style="text-align:center;font-size:34px;margin:18px 0 40px;opacity:.75">حكاية دار</div>
 <div style="font-size:40px;font-weight:700;margin:26px 0 6px">الفصل الأول</div><div style="font-size:32px;opacity:.7">النعيرية</div>
 <div style="font-size:40px;font-weight:700;margin:30px 0 6px">الفصل الثاني</div><div style="font-size:32px;opacity:.7">الفناتير · الجبيل</div>
 <div style="font-size:40px;font-weight:700;margin:30px 0 6px">الفصل الجاي</div><div style="font-size:32px;opacity:.7">قريباً بإذن الله</div></div><div class="fold"></div>`;
const curlPg=curl.querySelector('.pg'), curlFold=curl.querySelector('.fold');
// J — checklist
const lJ=L('J'); const chk=el('div','',lJ); chk.id='chk';
const CH=[['النعيرية','الفرع الأول',true],['الفناتير · الجبيل','الفرع الثاني',true],['فرعنا الجاي','قريباً بإذن الله',false]];
const chkMarks=CH.map(([h,sub,ok],i)=>{const it=el('div','it',chk);it.style.top=(360+i*390)+'px';
  it.innerHTML=`<h3>${h}</h3><p>${sub}</p><div class="box"></div>`+
   (ok?`<svg width="140" height="140" viewBox="0 0 140 140"><path d="M22 74 L58 112 L128 8" fill="none" stroke="#1d1a17" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      :`<svg width="140" height="140" viewBox="0 0 140 140"><text x="70" y="108" text-anchor="middle" font-family="Ruqaa" font-weight="700" font-size="92" fill="#5b1914">؟</text></svg>`);
  const p=it.querySelector('svg path');if(p){const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L;p.dataset.l=L}
  return it});
// K — wide night facade with tracked sign
const lK=L('K'); full(slot(lK,'10-wide-night','الواجهة من بعيد ليلاً<br>(سيارة تمر قدامها)','night'));
const sign=el('div','abs',lK,'حيّاكم في دار'); Object.assign(sign.style,{left:'0',right:'0',top:'360px',textAlign:'center',fontFamily:'Naskh',fontWeight:700,fontSize:'64px',color:'#fff7e6',
  textShadow:'0 0 18px rgba(255,214,150,.8),0 0 40px rgba(255,190,110,.5)',transform:'perspective(900px) rotateY(-8deg)'});

// caption

   radial-gradient(70% 20% at 50% 95%,rgba(130,160,110,.45),#0000 70%);filter:blur(6px)"></div>
  <div class="ph small" style="position:absolute;left:300px;right:300px;bottom:260px;height:200px;color:#6b3a22"><div class="k">11-watercolor</div><div class="d">لوحة مائية للجبيل</div></div>`;
const wcTitle=el('div','',outro); wcTitle.id='wcTitle';
const endlogo=document.getElementById('endlogo');
endlogo.innerHTML = A['logo'] ? `<img src="${A['logo']}" style="width:420px">` : `<div class="logo-txt" style="font-size:260px">دار</div>`;

/* ======================== CAPTIONS ======================== */
// [start, end(visible until), lines (words separated by space), speech window for word timing, boxed?]
const CAPS_OLD=[
 [0.00,1.64,['ياهلا وسهلا!'],[0.02,0.9]],
 [1.64,2.93,['كثير يسألونا…'],[1.64,2.4]],
 [2.93,4.33,['ليه سميناه','دار؟'],[2.93,3.85]],
 [4.33,7.58,['لأننا من البداية','ما بغيناه','مقهى وبس…'],[4.33,7.2]],
 [7.58,10.46,['بغيناه مكان','تحس فيـه','إنك بين أهلك'],[7.58,9.9]],
 [10.46,12.25,['ومن أول يوم','في النعيـرية'],[10.46,11.8]],
 [12.25,14.53,['كانت كلمتنا:','مرحبـا…'],[12.25,14.0]],
 [14.53,16.61,['والقلب أوسع','من الـدار'],[14.53,16.1]],
 [16.61,19.45,['وما كانت عبارة','وبس…','كانت وعد'],[16.61,19.0]],
 [19.45,22.67,['إن كل زيارة','تكون مليانة','ضيافة وراحة'],[19.45,22.1]],
 [22.67,25.94,['واليوم،','بفضل الله','ثم ثقتكم وحبكم'],[22.67,25.5]],
 [25.94,28.85,['نكتب فصل جديد','بافتتاح','فرعنا الثاني'],[25.94,28.5]],
 [28.85,30.48,['في الفناتير','بالجبيل'],[28.85,29.9]],
 [30.48,32.06,['وهذي','البداية','بس…'],[30.48,31.6],true],
 [32.06,33.49,['وخلال','السنة الجاية'],[32.06,33.2]],
 [37.26,41.16,['أهل النعيرية،','أهل الجبيل،','وكل من مرّ علينا…'],[37.26,40.6]],
];
const CAPS=[
 [0.00,1.64,['ياهلا','وسهلا!'],[0.02,0.9]],
 [1.64,2.93,['كثير','يسألونا…'],[1.64,2.4]],
 [2.93,4.33,['ليه','سميناه','دار؟'],[2.93,3.85]],
 [4.33,7.58,['لأننا','من البداية','ما بغيناه','مقهى وبس…'],[4.33,7.2]],
 [7.58,10.46,['بغيناه','مكان','تحس فيـه','إنك بين','أهلك'],[7.58,9.9]],
 [10.46,12.25,['ومن أول','يوم في','النعيـرية'],[10.46,11.8]],
 [12.25,14.53,['كانت','كلمتنا:','مرحبـا…'],[12.25,14.0]],
 [14.53,16.61,['والقلب','أوسع','من الـدار'],[14.53,16.1]],
 [16.61,19.45,['وما كانت','عبارة وبس…','كانت وعد'],[16.61,19.0]],
 [19.45,22.67,['إن كل','زيارة','مليانة','ضيافة وراحة'],[19.45,22.1]],
 [22.67,25.94,['واليوم،','بفضل الله','ثم ثقتكم','وحبكم'],[22.67,25.5]],
 [25.94,27.40,['نكتب','فصل جديد'],[25.94,27.2]],
 [30.48,32.06,['وهذي','البداية','بس…'],[30.48,31.6],true],
 [32.06,33.49,['وخلال','السنة','الجاية'],[32.06,33.2]],
 [37.26,41.16,['أهل النعيرية،','أهل الجبيل،','وكل من','مرّ علينا…'],[37.26,40.6]],
];
// pre-split + per-word timing proportional to length
const CAPW=CAPS.map(([s,e,lines,[a,b],boxed])=>{
  const words=[];lines.forEach((ln,li)=>ln.split(' ').forEach(w=>words.push({w,li})));
  const tot=words.reduce((n,x)=>n+x.w.length+2,0);let acc=0;
  words.forEach(x=>{x.t=a+(b-a)*acc/tot;acc+=x.w.length+2});
  return {s,e,lines,words,boxed:!!boxed};
});
const CAPY={default:860};
function drawCap(t){
  const c=CAPW.find(c=>t>=c.s&&t<c.e);
  if(!c){cap.innerHTML='';return}
  cap.className=c.boxed?'boxed':'';
  let html='';c.lines.forEach((_,li)=>{
    const ws=c.words.filter(x=>x.li===li).map(x=>`<span class="w" style="visibility:${t>=x.t?'visible':'hidden'}">${x.w}</span>`).join('');
    html+=`<span class="ln">${ws}</span>`});
  cap.innerHTML=html;
  const h=c.lines.length*(c.boxed?112:124);
  cap.style.top=((c.boxed?820:CAPY.default)-h/2)+'px';
}

/* ======================== RENDER(t) ======================== */
const SCN=[['A',0,1.64],['B',1.64,4.33],['C',4.33,7.58],['D',7.58,11.0],['E',10.46,17.4],['F',16.61,22.67],['G',22.67,25.94],['H',25.94,30.48],['I',30.48,33.49],['J',33.49,37.26],['K',37.26,41.16]];
// "camera is always alive": slow push-in on every full-bleed shot (spring 'camera'), reset at each cut
function kb(e,t0,t){const s=1+0.06*spring(t-t0,'camera')*Math.min(1,(t-t0)/3);e.style.transform=`scale(${s})`;e.style.transformOrigin='50% 45%'}
window.render=function(t){
  SCN.forEach(([n,a,b])=>vis(scenes[n],t>=a&&t<b));

  // A
  kb(lA.firstChild,0,t);
  // B: hard cuts on the beat (reference), same object same spot
  const bc=[1.64,2.05,2.45,2.93];Bs.forEach((s,i)=>{const on=t>=bc[i]&&(i===3||t<bc[i+1]);vis(s,on);if(on)kb(s,bc[i],t)});
  if(t>=4.33&&t<4.70){vis(scenes.B,true);vis(Bs[3],true)}

  // C: card springs in over last shot, bg turns burgundy, card glides smaller
  vis(cBg,t>=4.70);
  { const p=pop(t,4.33,'snap'); const sh=spring(t-4.70,'glide');
    setB(cCard,p.o,`scale(${p.s*lerp(1.12,0.94,sh)}) rotate(${lerp(0,-1.5,sh)}deg)`,p.b); }
  vis(cImg2,t>=6.10);
  tags.forEach((g,i)=>{const p=pop(t,6.45+i*.14);setB(g,p.o,`rotate(${g.dataset.r}deg) scale(${p.s})`,p.b)});

  // D: notes – each starts at ~60% of previous spring (≈0.13s), slide up + rotate settle
  notes.forEach((n,i)=>{const t0=7.58+i*.13;const sp=spring(t-t0,'snap');const f=x=>spring(x-t0,'snap');
    setB(n,expoOut(clamp((t-t0)/.09)),`translateY(${lerp(220,0,sp)}px) rotate(${+n.dataset.r+lerp(12,0,sp)}deg) scale(${lerp(.8,1,sp)})`,blurOf(f,t,30))});

  // E: stamps snap in, drift (camera), then exit up with expo-in + blur, overlapping F
  stamps.forEach((s,i)=>{const p=pop(t,10.46+i*.12);const dr=spring(t-10.46,'camera')*Math.min(1,(t-10.46)/6);
    const t1=16.61+i*.09;const ox=x=>Math.pow(clamp((x-t1)/.3),3);const out=ox(t);
    setB(s,p.o*(1-clamp(out*1.4-.4)),`translate(${-dr*18}px,${-dr*30-out*1500}px) rotate(${+s.dataset.r+dr*1.5-out*14}deg) scale(${p.s*(1+dr*.03)})`,Math.max(p.b,Math.min(Math.abs(ox(t)-ox(t-.04))*120,16)))});

  // F: bubbles
  bubs.forEach((b,i)=>{const t0=16.66+i*.13;const p=pop(t,t0);const sp=spring(t-t0,'snap');
    const t1=22.2+i*.08;const ox=x=>Math.pow(clamp((x-t1)/.28),3);const out=ox(t);
    setB(b,p.o,`translateY(${lerp(80,0,sp)-out*1500}px) scale(${p.s})`,Math.max(p.b,Math.min(Math.abs(ox(t)-ox(t-.04))*120,16)))});

  // G: night hard cuts + push-in
  const gc=[22.67,23.51,24.6];Gs.forEach((s,i)=>{const on=t>=gc[i]&&(i===2||t<gc[i+1]);vis(s,on);if(on)kb(s,gc[i],t)});

  // H: facade then map: roads draw while camera pulls back, pins drop with snap
  kb(hFac,25.94,t);
  const mapOn=t>=27.4; vis(hMap,mapOn);
  if(mapOn){
    const svg=hMap.querySelector('svg');const z=lerp(1.55,1.0,spring(t-27.4,'glide'));
    svg.style.transform=`scale(${z})`;svg.style.transformOrigin='45% 45%';
    hMap.querySelectorAll('#roads path').forEach((p,i)=>{const L=p.getTotalLength();p.style.strokeDasharray=L;p.style.strokeDashoffset=L*(1-expoOut(clamp((t-27.42-i*.03)/.9)))});
    hMap.querySelector('#boxes').style.opacity=expoOut(clamp((t-28.0)/.4));
    [['#pin1','#lb1',28.6],['#pin2','#lb2',29.4]].forEach(([pi,lb,t0])=>{const g=hMap.querySelector(pi);const sp=spring(t-t0,'snap');
      g.setAttribute('transform',`translate(${g.dataset.tx} ${+g.dataset.ty-lerp(140,0,sp)})`);g.style.opacity=expoOut(clamp((t-t0)/.08));
      const l=hMap.querySelector(lb);l.style.opacity=expoOut(clamp((t-t0-.12)/.25))});
  }

  // I: interior (boxed words) -> real hand -> paper enters with page-curl (match cut)
  vis(iInt,t<32.06); vis(iHand,t>=32.06&&t<32.45); vis(iBg,t>=32.45); vis(curl,t>=32.45);
  kb(iInt,30.48,t);
  if(t>=32.45){const e=spring(t-32.45,'glide');const f=lerp(760,0,spring(t-32.52,'glide'));
    curl.style.transform=`translate(${lerp(-560,0,e)}px,${lerp(-700,0,e)}px) rotate(${lerp(-40,-2.5,e)}deg) scale(${lerp(.8,1,e)})`;
    curlPg.style.clipPath=`polygon(${f}px 0,100% 0,100% 100%,0 100%,0 ${f}px)`;
    Object.assign(curlFold.style,{width:f+'px',height:f+'px',opacity:f>2?1:0,borderRight:'6px solid var(--navy)'});}

  // J: checklist – hand-drawn ticks one after another
  chkMarks.forEach((it,i)=>{const p=it.querySelector('svg path');const t0=[33.85,34.75,35.75][i];
    if(p){p.style.strokeDashoffset=p.dataset.l*(1-expoOut(clamp((t-t0)/.3)))}
    else{const tx=it.querySelector('svg');const pp=pop(t,t0);tx.style.opacity=pp.o;tx.style.transform=`scale(${pp.s})`}});

  // K
  kb(lK.firstChild,37.26,t);
  sign.style.transform=`perspective(900px) rotateY(-8deg) translateX(${(t-37.26)*-8}px)`;

  // captions (map scene carries its own labels)
  drawCap(t);

  // OUTRO: frame disappears, watercolor glides up from bottom, title builds word by word
  const outroOn=t>=41.16&&t<VO_END;
  vis(W,t<41.16); vis(outro,outroOn);
  if(outroOn){const y=spring(t-41.16,'glide');
    wc.style.top=lerp(1920,440,y)+'px';
    wcTitle.style.top=lerp(1920+120,440+170,y)+'px';
    const l1=['يا هلا','وسهلا…'],l2=['والقلب','أوسع','من الـدار'];
    const tm=[41.2,41.6],tm2=[42.54,43.37,43.75];
    wcTitle.innerHTML=`<div>${l1.map((w,i)=>`<span style="visibility:${t>=tm[i]?'visible':'hidden'}">${w}</span>`).join(' ')}</div>`+
      `<div>${l2.map((w,i)=>`<span style="visibility:${t>=tm2[i]?'visible':'hidden'}">${w}</span>`).join(' ')}</div>`;}
  vis(endlogo,t>=VO_END);
};
